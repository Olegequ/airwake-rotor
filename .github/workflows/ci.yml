name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regression tests
        run: python -m pytest
      - name: Synthetic coupled example
        run: airwake-rotor demo --output runs/ci-demo
      - name: Release scan
        run: python scripts/check_release.py
      - name: Build distributions
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m airwake_rotor demo --output airwake-wheel-demo
