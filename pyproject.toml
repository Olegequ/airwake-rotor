[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwake-rotor"
version = "0.1.0"
description = "Airwake modal decomposition and one-way nonlinear rotorcraft dynamics by Olegequ"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Olegequ"}]
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
keywords = ["airwake", "rotorcraft", "RVMD", "DMD", "CFD", "modal-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23,<2",
  "scipy>=1.9,<2",
  "pandas>=1.5,<3",
  "matplotlib>=3.6,<4",
  "Pillow>=9.2,<13",
  "imageio>=2.25,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "build>=1,<2", "wheel"]
cuda = ["torch>=2.1,<3"]

[project.urls]
Repository = "https://github.com/Olegequ/airwake-rotor"
Issues = "https://github.com/Olegequ/airwake-rotor/issues"

[project.scripts]
airwake-rotor = "airwake_rotor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
